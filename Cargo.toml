[workspace]
resolver = "3"
members = ["crates/iiod_client", "crates/m2k", "crates/m2k_cli", "crates/m2k_py"]

[workspace.package]
version = "0.4.1"
edition = "2024"
authors = ["Roman Isaikin <roman@vhrd.tech>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/romixlab/m2k_cli"
rust-version = "1.88"

[workspace.dependencies]
m2k = { path = "crates/m2k", version = "0.4.1" }
iiod_client = { path = "crates/iiod_client", version = "0.4.1" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
ctrlc = { version = "3.5", features = ["termination"] }
indicatif = "0.18"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde_json = "1"
thiserror = "2"
